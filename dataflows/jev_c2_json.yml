# Jev に手先の移動方向と指の開閉を選ばせる (計画の C2)。JSON 入力条件: Jev に物体の位置の真値を渡す。
# INPUT を image_json にすると、カメラ画像も渡す。Jev は OpenRouter 経由で呼ぶので .env に OPENROUTER_API_KEY が要る。
#   uv run --env-file .env dora run dataflows/jev_c2_json.yml --log-level info
nodes:
  - id: sim
    path: ../nodes/sim.py
    inputs:
      tick:
        source: dora/timer/millis/50
        queue_size: 1
      command:
        source: policy/command
        queue_size: 100
    outputs:
      - task
      - image_agentview
      - image_wrist
      - robot_state
      - ground_truth
      - command_result
      - episode_end
    env:
      SUITE: libero_goal
      TASK: "8"
      INIT: "0"
      # Jev が受け付ける画像は一辺 256 px 以上
      IMAGE_SIZE: "320"
      # 1 回の判断に 1 秒前後かかるので、100 回の判断に足りる長さにする
      MAX_STEPS: "3000"

  - id: policy
    path: ../nodes/jev_policy.py
    inputs:
      task: sim/task
      # JSON 入力条件: 物体の位置を真値から受け取る
      scene:
        source: sim/ground_truth
        queue_size: 1
      # 判断を始めるときに最新の観測を読めるよう、古いものは溜めない
      robot_state:
        source: sim/robot_state
        queue_size: 1
      image_agentview:
        source: sim/image_agentview
        queue_size: 1
      image_wrist:
        source: sim/image_wrist
        queue_size: 1
      command_result:
        source: sim/command_result
        queue_size: 100
    outputs: [command, decision]
    env:
      INPUT: json
      CAMERAS: agentview,wrist
      STEP_M: "0.02"
      MAX_DECISIONS: "100"

  - id: evaluator
    path: ../nodes/evaluator.py
    inputs:
      image_agentview:
        source: sim/image_agentview
        queue_size: 1000
      image_wrist:
        source: sim/image_wrist
        queue_size: 1000
      ground_truth:
        source: sim/ground_truth
        queue_size: 1000
      robot_state:
        source: sim/robot_state
        queue_size: 1000
      task: sim/task
      episode_end: sim/episode_end
      command_result:
        source: sim/command_result
        queue_size: 1000
      command:
        source: policy/command
        queue_size: 1000
      decision:
        source: policy/decision
        queue_size: 1000
