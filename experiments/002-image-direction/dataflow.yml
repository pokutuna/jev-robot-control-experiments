# 実験 002: 指示文、手先の状態、カメラ画像 2 枚だけを渡し、Jev に手先の移動方向と指を選ばせる (s1cap.jev_policy の
# JevDirectionPolicy、1 回呼び出し)。真値は policy に配線しない。手首の画像は 180° 回して渡す。
# Jev は OpenRouter 経由で呼ぶので .env に OPENROUTER_API_KEY が要る。INIT と OUT_DIR は scripts/run_experiment.py が書き換える
#   uv run --env-file .env scripts/run_experiment.py run experiments/002-image-direction --inits 0-9
nodes:
  - id: sim
    path: ../../nodes/sim.py
    inputs:
      tick:
        source: dora/timer/millis/50
        queue_size: 1
      command:
        source: policy/command
        queue_size: 100
    outputs:
      - task
      - image_agentview
      - image_wrist
      - robot_state
      - ground_truth
      - command_result
      - episode_end
    env:
      SUITE: libero_90
      TASK: "60"
      FIXED_VIEW: quarterview
      INIT: "0"
      IMAGE_SIZE: "320"
      # 1 回の判断に 1〜2 秒かかるので、120 回の判断に足りる長さにする
      MAX_STEPS: "7000"

  - id: policy
    path: ../../nodes/jev_policy.py
    inputs:
      task: sim/task
      # 判断を始めるときに最新の観測を読めるよう、古いものは溜めない
      robot_state:
        source: sim/robot_state
        queue_size: 1
      image_agentview:
        source: sim/image_agentview
        queue_size: 1
      image_wrist:
        source: sim/image_wrist
        queue_size: 1
      command_result:
        source: sim/command_result
        queue_size: 100
    outputs: [command, decision]
    env:
      POLICY: direction
      INPUT: image
      CAMERAS: agentview,wrist
      STEP_M: "0.02"
      MAX_DECISIONS: "120"

  - id: evaluator
    path: ../../nodes/evaluator.py
    inputs:
      image_agentview:
        source: sim/image_agentview
        queue_size: 1000
      image_wrist:
        source: sim/image_wrist
        queue_size: 1000
      ground_truth:
        source: sim/ground_truth
        queue_size: 1000
      robot_state:
        source: sim/robot_state
        queue_size: 1000
      task: sim/task
      episode_end: sim/episode_end
      command_result:
        source: sim/command_result
        queue_size: 1000
      command:
        source: policy/command
        queue_size: 1000
      decision:
        source: policy/decision
        queue_size: 1000
