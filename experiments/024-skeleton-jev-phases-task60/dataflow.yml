# 実験 024: 023 の手順の骨組み (../023-skeleton-jev-phases/programs/skeleton.py) を変えずに、タスクに固有の値だけを
# libero_90 60 (左の黒いボウルをトレイへ) のもの (../023-skeleton-jev-phases/programs/task60.py) に替えて回す。
# 物の位置の真値は policy に配線しない。
# Jev は OpenRouter 経由で呼ぶので .env に OPENROUTER_API_KEY が要る。INIT と OUT_DIR は scripts/run_experiment.py が書き換え、
# PROGRAM のパスは実験のディレクトリから解決する
#   uv run --env-file .env scripts/run_experiment.py run experiments/024-skeleton-jev-phases-task60 --inits 0-9
nodes:
  - id: sim
    path: ../../nodes/sim.py
    inputs:
      tick:
        source: dora/timer/millis/50
        queue_size: 1
      command:
        source: policy/command
        queue_size: 100
    outputs:
      - task
      - image_agentview
      - image_wrist
      - robot_state
      - ground_truth
      - sim_state
      - command_result
      - episode_end
    env:
      SUITE: libero_90
      TASK: "60"
      FIXED_VIEW: quarterview
      INIT: "0"
      IMAGE_SIZE: "448"
      # 1 回の判断に 1〜2 秒かかるので、200 回の判断に足りる長さにする
      MAX_STEPS: "9000"

  - id: policy
    path: ../../nodes/jev_policy.py
    inputs:
      task: sim/task
      # 判断を始めるときに最新の観測を読めるよう、古いものは溜めない
      robot_state:
        source: sim/robot_state
        queue_size: 1
      image_agentview:
        source: sim/image_agentview
        queue_size: 1
      image_wrist:
        source: sim/image_wrist
        queue_size: 1
      command_result:
        source: sim/command_result
        queue_size: 100
    outputs: [command, decision]
    env:
      POLICY: cap
      # タスクに固有の値、骨組みの順につないで 1 つのプログラムにする
      PROGRAM: ../023-skeleton-jev-phases/programs/task60.py,../023-skeleton-jev-phases/programs/skeleton.py
      JEV_BUDGET: "360"
      # 手首の画像の × を、手先の高さごとに真下のテーブルの点に描く
      CROSS: height
      MAX_MOVES: "200"
      # 最初の判断 (手先を下向きにそろえる) の分だけ MAX_MOVES より多くする
      MAX_DECISIONS: "201"

  - id: evaluator
    path: ../../nodes/evaluator.py
    inputs:
      image_agentview:
        source: sim/image_agentview
        queue_size: 1000
      image_wrist:
        source: sim/image_wrist
        queue_size: 1000
      ground_truth:
        source: sim/ground_truth
        queue_size: 1000
      robot_state:
        source: sim/robot_state
        queue_size: 1000
      # 動画を後から描き直すための MuJoCo の状態 (scripts/render_episode.py)
      sim_state:
        source: sim/sim_state
        queue_size: 1000
      task: sim/task
      episode_end: sim/episode_end
      command_result:
        source: sim/command_result
        queue_size: 1000
      command:
        source: policy/command
        queue_size: 1000
      decision:
        source: policy/decision
        queue_size: 1000
    env:
      # 動画にも Jev に渡す画像と同じ印を描く
      WRIST_CROSS_UV: height
      FIXED_MARK: "1"
